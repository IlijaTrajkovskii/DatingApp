
<div routerLink="/members/{{member().id}}" class="card cursor-pointer 
    transition-all ease-in-out transform hover:-translate-y-1.5 duration-300 ">
    
    <img src="{{member()?.imageUrl || '/user.png'}}" alt="{{member().displayName}} Image" class="rounded-xl">

    <div class="card-action absolute bottom-0 z-49 w-full px-3 py-1 rounded-b-lg 
    bg-linear-to-t from-black via-black/75 to-black/0">

        <div class="flex flex-col text-white">
            <span class="font-semibold">{{member().displayName}}, {{member().dateOfBirth | age}}</span>
            <span class="text-sm">{{member().city}}</span>
        </div>

    </div>

</div>
