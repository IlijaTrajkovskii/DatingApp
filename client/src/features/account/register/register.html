<div class="card bg-base-300 w-1/2 mx-auto flex flex-col p-5 rounded-lg shadow-lg">
    <div class="card-title justify-center text-primary text-3xl font-semibold">Sign up</div>

    <div class="card-body w-full">

        <form #registerForm="ngForm" (ngSubmit)="register()" class="flex flex-col w-full gap-2">

            <input [(ngModel)]="creds.email" class="input w-full" name="email" placeholder="Email">
            <input [(ngModel)]="creds.displayName" class="input w-full" name="displayName" placeholder="Display name">
            <input [(ngModel)]="creds.password" type="password" class="input w-full" name="password" placeholder="Password"> 


            <div class="flex justify-end gap-2 pt-2">
                <button (click)="cancel()" class="btn" type="button">Cancel</button>
                <button class="btn btn-primary" type="submit">Register</button>

            </div>

            
            
        </form>

    </div>

</div>
