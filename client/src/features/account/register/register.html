<div class="card bg-base-100 w-1/2 mx-auto flex flex-col p-5 rounded-lg shadow-lg">
    <span class="card-title justify-center text-primary text-3xl font-semibold">Sign up</span>

    <div class="card-body w-full">

        <ul class="steps mb-1">
            <li class="step step-primary">Credentials</li>
            <li class="step" [class.step-primary]="currentStep() === 2">Profile</li>
        </ul>

        @if(currentStep() === 1)
        {
            <form [formGroup]="credentialsForm" class="flex flex-col w-full gap-4 steps px-1 mt-4">
    
                <app-text-input label="Email" formControlName="email" class="mt-2.5"/>
                <app-text-input label="Display name" formControlName="displayName" />
                <app-text-input label="Password" formControlName="password" type="password" />
                <app-text-input label="Confirm Password" formControlName="confirmPassword" type="password" />
    
                <div class="flex justify-end gap-2 pt-2">
                    <button (click)="cancel()" class="btn" type="button">Cancel</button>
                    <button (click)="nextStep()" [disabled]="!credentialsForm.valid" class="btn btn-primary" type="button">Next</button>
                </div>
    
            </form>
        }

        @if(currentStep() === 2)
        {
            <form [formGroup]="profileForm" class="flex flex-col w-full gap-4 steps px-1 mt-4">

                <div class="flex gap-4 items-center mb-1">

                    <div class="font-semibold">Gender:</div>

                    <label class="flex gap-3 items-center">
                        <span>Male</span>
                        <input type="radio" formControlName="gender" value="male" class="radio radio-primary">
                    </label>

                    <label class="flex gap-3 items-center">
                        <span>Female</span>
                        <input type="radio" formControlName="gender" value="female" class="radio radio-primary">
                    </label>

                </div>

                <app-text-input [maxDate]="getMaxDate()" type="Date" label="Date of Birth" formControlName="dateOfBirth" />
                <app-text-input label="City" formControlName="city" />
                <app-text-input label="Country" formControlName="country" />

                <div class="flex justify-end gap-2 pt-2">
                    <button (click)="prevStep()" class="btn" type="button">Back</button>
                    <button (click)="register()" [disabled]="!profileForm.valid" class="btn btn-primary" type="submit">Register</button>
                </div>

            </form>
        }


    </div>

    <!-- Testing -->
   @if(validationErrors().length > 0) 
   {
    <div class="flex mt-5 bg-gray-200 rounded-2xl w-1/2 p-3 mx-auto">
        <ul class="flex flex-col text-error space-y-1">
            @for(error of validationErrors(); track $index)
            {
                <li>{{error}}</li>
            }
        </ul>
    </div>
   }


</div>
